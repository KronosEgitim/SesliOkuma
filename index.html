<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesli Okuma | Kronos Eğitim</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#192436;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1080px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}h1{font-size:1.65rem;margin:0}header small{color:#64748b}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:22px;box-shadow:0 3px 14px #17203308}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.file{border:1px dashed #94a3b8;border-radius:10px;padding:10px 14px;cursor:pointer;background:#f8fafc}.file input{display:none}button{border:0;border-radius:10px;background:#1d4ed8;color:white;padding:12px 18px;font-weight:650;cursor:pointer}button.secondary{background:#e2e8f0;color:#334155}button:disabled{opacity:.4;cursor:not-allowed}.speed-setting{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:#334155}.speed-setting input{width:65px;padding:9px 7px;border:1px solid #94a3b8;border-radius:8px;font:inherit;text-align:center}.filename{color:#64748b;font-size:.9rem}.status{min-height:28px;font-weight:650;color:#475569;margin-bottom:12px}.status.error{color:#b91c1c}.reading{font-size:clamp(1.25rem,2.1vw,1.8rem);line-height:2.15;white-space:pre-wrap;overflow-wrap:anywhere;min-height:220px;padding:20px;background:#fbfcfe;border:1px solid #edf0f5;border-radius:12px}.word{border-radius:4px;transition:color .12s}.word.active{font-weight:800;text-decoration:underline;text-decoration-color:#94a3b8;text-underline-offset:7px}.word.correct{color:#15803d}.word.wrong,.word.silent{color:#dc2626}.placeholder{color:#94a3b8;font-size:1rem}.results{display:none;margin-top:20px}.results.show{display:block}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:#f8fafc;padding:16px;border-radius:12px;text-align:center}.stat strong{display:block;font-size:1.5rem}.stat span{font-size:.83rem;color:#64748b}.hint{font-size:.85rem;color:#64748b;margin-top:16px}@media(max-width:640px){.wrap{padding:12px}.panel{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main class="wrap">
<header><h1>Sesli Okuma v2</h1><small>KRONOS EĞİTİM</small></header>
<section class="panel">
<div class="toolbar">
<label class="file">📄 TXT dosyası seç <input id="file" type="file" accept=".txt,text/plain"></label>
<span id="filename" class="filename">Henüz dosya seçilmedi</span>
<label class="speed-setting" for="speed">Okuma hızı: <input id="speed" type="number" min="1" max="20" step="1" value="1" inputmode="numeric" aria-label="Saniyedeki kelime sayısı"> kelime/saniye</label>
<button id="start" disabled>▶ Okumaya Başla</button>
<button id="stop" class="secondary" disabled>■ Durdur</button>
<button id="reset" class="secondary" disabled>↻ Sıfırla</button>
</div>
<div id="status" class="status" role="status" aria-live="polite"></div>
<div id="reading" class="reading"><span class="placeholder">Okunacak metni yüklemek için bir TXT dosyası seçin.</span></div>
<section id="results" class="results"><h2>Okuma Sonuçları</h2><div id="stats" class="stats"></div></section>
<div class="hint">En iyi sonuç için Chrome veya Edge kullanın ve mikrofon izni verin. Konuşma tanıma tarayıcıya bağlı olarak internet bağlantısı gerektirebilir.</div>
</section></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const speed=$('speed');
const file=$('file'),start=$('start'),stop=$('stop'),reset=$('reset'),reading=$('reading'),status=$('status');
let tokens=[],cursor=0,consecutiveSilences=0,active=false,recognition=null,stream=null,audioContext=null,analyser=null,audioBuffer=null,raf=0,tick=0,wordStarted=0,lastVoice=0,voicePresent=false,startedAt=0,elapsed=0,recognitionRestart=null,recognitionLastFinal='',processedFinals=new Set();
const normalize=s=>(s||'').toLocaleLowerCase('tr-TR').replace(/[^\p{L}\p{N}]/gu,'');
function showStatus(message='',error=false){status.textContent=message;status.classList.toggle('error',error)}
function buttons(){start.disabled=active||!tokens.length;stop.disabled=!active;reset.disabled=active||!tokens.length;file.disabled=active;speed.disabled=active}
function render(){reading.replaceChildren();if(!tokens.length)return;const fragment=document.createDocumentFragment();tokens.forEach((t,i)=>{const span=document.createElement('span');span.className='word'+(t.state?' '+t.state:'')+(active&&i===cursor?' active':'');span.textContent=t.text;fragment.append(span,document.createTextNode(t.after))});reading.append(fragment);if(active&&tokens[cursor]){const el=reading.querySelector('.active');if(el){const r=el.getBoundingClientRect();if(r.bottom>innerHeight-45||r.top<0)el.scrollIntoView({block:'center',behavior:'smooth'})}}}
function parseText(raw){const re=/\S+/g;const found=[...raw.matchAll(re)];tokens=found.map((m,i)=>({text:m[0],norm:normalize(m[0]),after:raw.slice(m.index+m[0].length,found[i+1]?.index??raw.length),state:''})).filter(t=>t.norm);cursor=0;consecutiveSilences=0;elapsed=0;render();$('results').classList.remove('show');buttons()}
file.addEventListener('change',async()=>{const f=file.files?.[0];if(!f)return;if(!/\.txt$/i.test(f.name)){showStatus('Lütfen .txt uzantılı dosya seçin.',true);return}if(f.size>2*1024*1024){showStatus('Lütfen 2 MB altında bir TXT dosyası seçin.',true);return}try{const raw=await f.text();parseText(raw);$('filename').textContent=f.name;showStatus(tokens.length?`${tokens.length} kelime yüklendi.`:'Dosyada okunabilir kelime bulunamadı.',!tokens.length)}catch(e){showStatus('Dosya okunamadı.',true)}});
function mark(state){if(!active||cursor>=tokens.length)return;tokens[cursor].state=state;cursor++;consecutiveSilences=state==='silent'?consecutiveSilences+1:0;wordStarted=performance.now();lastVoice=wordStarted;voicePresent=false;render();if(consecutiveSilences>=3){finish('Üst üste 3 kelime okunmadı',true);return}if(cursor>=tokens.length)finish('Okuma tamamlandı');}
// Tanınan konuşmayı mevcut konumla hizalar. Birkaç kelime ileriye eşleşme varsa aradakiler atlanmış sayılır.
function consumeTranscript(phrase){if(!active)return;const heard=(phrase.toLocaleLowerCase('tr-TR').match(/[\p{L}\p{N}]+/gu)||[]).map(normalize).filter(Boolean);for(let k=0;k<heard.length&&active;k++){const h=heard[k];if(!tokens[cursor])break;if(h===tokens[cursor].norm){mark('correct');continue}let found=-1;for(let j=cursor+1;j<Math.min(tokens.length,cursor+4);j++){if(tokens[j].norm===h){found=j;break}}if(found!==-1){while(active&&cursor<found)mark('wrong');if(active)mark('correct')}else{mark('wrong')}}}
function setupRecognition(){recognition=new SR();recognition.lang='tr-TR';recognition.continuous=true;recognition.interimResults=true;recognition.maxAlternatives=1;recognition.onresult=e=>{if(!active)return;for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(!r.isFinal)continue;const phrase=r[0]?.transcript||'';if(phrase.trim())consumeTranscript(phrase)}};recognition.onerror=e=>{if(!active)return;if(['not-allowed','service-not-allowed','audio-capture','language-not-supported'].includes(e.error)){finish('Mikrofon veya konuşma tanıma kullanılamıyor: '+e.error,true)}else if(e.error==='network'){finish('Konuşma tanıma bağlantı hatası.',true)}};recognition.onend=()=>{if(active){clearTimeout(recognitionRestart);recognitionRestart=setTimeout(()=>{if(active)try{recognition.start()}catch(e){}},250)}};recognition.start()}
async function begin(){if(!tokens.length||active)return;const rate=Number(speed.value);if(!Number.isInteger(rate)||rate<1||rate>20){showStatus('Okuma hızı için 1 ile 20 arasında bir tam sayı girin.',true);speed.focus();return;}if(!SR){showStatus('Bu tarayıcı konuşma tanımayı desteklemiyor. Chrome veya Edge deneyin.',true);return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});audioContext=new (window.AudioContext||window.webkitAudioContext)();await audioContext.resume();const source=audioContext.createMediaStreamSource(stream);analyser=audioContext.createAnalyser();analyser.fftSize=2048;source.connect(analyser);audioBuffer=new Float32Array(analyser.fftSize);active=true;startedAt=performance.now();wordStarted=startedAt;lastVoice=startedAt;voicePresent=false;showStatus('');$('results').classList.remove('show');buttons();render();setupRecognition();tick=setInterval(checkSilence,100);monitorAudio()}catch(e){active=false;cleanup();buttons();showStatus('Mikrofona erişilemedi. Tarayıcı izinlerini kontrol edin.',true)}}
function monitorAudio(){if(!active||!analyser)return;analyser.getFloatTimeDomainData(audioBuffer);let sum=0;for(let i=0;i<audioBuffer.length;i++)sum+=audioBuffer[i]*audioBuffer[i];const rms=Math.sqrt(sum/audioBuffer.length);const now=performance.now();if(rms>0.025){voicePresent=true;lastVoice=now}raf=requestAnimationFrame(monitorAudio)}
function getWordTimeout(){const rate=Number(speed.value);return 1000/rate}
function checkSilence(){if(!active)return;const now=performance.now();if(voicePresent){if(now-lastVoice>500){voicePresent=false;wordStarted=now}return}if(now-wordStarted>=getWordTimeout())mark('silent')}
function cleanup(){clearInterval(tick);cancelAnimationFrame(raf);clearTimeout(recognitionRestart);tick=raf=0;if(recognition){recognition.onend=null;recognition.onresult=null;recognition.onerror=null;try{recognition.abort()}catch(e){}recognition=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(audioContext){audioContext.close().catch(()=>{});audioContext=null}analyser=null}
function finish(message='',error=false){if(!active)return;elapsed=(performance.now()-startedAt)/1000;active=false;cleanup();buttons();render();showStatus(message,error);showResults()}
function showResults(){const done=tokens.filter(t=>t.state);const correct=done.filter(t=>t.state==='correct').length;const wrong=done.filter(t=>t.state==='wrong').length;const silent=done.filter(t=>t.state==='silent').length;const accuracy=done.length?Math.round(100*correct/done.length):0;const wpm=elapsed?Math.round(done.length*60/elapsed):0;const items=[['Doğruluk',accuracy+'%'],['Okuma hızı',wpm+' kelime/dk'],['Doğru',correct],['Yanlış',wrong],['Okunmayan',silent],['Süre',Math.round(elapsed)+' sn']];$('stats').replaceChildren();for(const [label,value] of items){const div=document.createElement('div');div.className='stat';const strong=document.createElement('strong');strong.textContent=value;const span=document.createElement('span');span.textContent=label;div.append(strong,span);$('stats').append(div)}$('results').classList.add('show')}
start.addEventListener('click',begin);stop.addEventListener('click',()=>finish('Okuma kullanıcı tarafından sonlandırıldı.'));reset.addEventListener('click',()=>{tokens.forEach(t=>t.state='');cursor=0;consecutiveSilences=0;elapsed=0;render();$('results').classList.remove('show');showStatus('');buttons()});buttons();
</script></body></html>
